name: R&D 공고 수집

on:
  schedule:
    # 매일 07:00 KST (22:00 UTC 전날)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "구조 진단 모드로 실행"
        type: boolean
        default: false
      no_score:
        description: "LLM 채점 생략"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: radar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: radar/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 파서 테스트
        run: python test_parsers.py

      - name: 수집 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_MODEL: claude-sonnet-5
        run: |
          ARGS=""
          if [ "${{ inputs.probe }}" = "true" ]; then ARGS="$ARGS --probe"; fi
          if [ "${{ inputs.no_score }}" = "true" ]; then ARGS="$ARGS --no-score"; fi
          python run.py $ARGS

      - name: 원본 HTML 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-html-${{ github.run_number }}
          path: radar/data/raw/
          retention-days: 7
          if-no-files-found: ignore

      # 사이트는 main 브랜치에서 GitHub Pages로 자동 배포되므로
      # 갱신된 파일을 main에 커밋하는 것으로 배포가 끝남
      - name: 변경사항 커밋
        if: ${{ inputs.probe != true }}
        working-directory: .
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar/data/opportunities.json radar/data/archive.json radar/data/score_cache.json radar/index.html || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "radar: 공고 갱신 $(date -u -d '+9 hours' +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin main
          fi
