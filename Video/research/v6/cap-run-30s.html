<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>뚜껑을 닫아라 · PPEL+ 30초 액션</title>
<style>
  html,body{margin:0;background:#0b1416;color:#dfeee8;font-family:"NanumGothic","Nanum Gothic",system-ui,sans-serif}
  .wrap{max-width:1300px;margin:0 auto;padding:18px}
  canvas{width:100%;aspect-ratio:16/9;display:block;background:#000;border-radius:10px}
  .bar{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
  button{background:#14413a;color:#cfeee2;border:1px solid #2c6b5d;border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer}
  button:hover{background:#1b564c}
  input[type=range]{flex:1;min-width:240px}
  .sub{min-height:2.6em;margin-top:10px;font-size:19px;line-height:1.35;text-align:center;color:#eaf6f1}
  .meta{color:#7d9c90;font-size:13px;margin-top:6px}
</style></head><body>
<div class="wrap">
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="bar">
    <button id="play">재생</button>
    <button id="restart">처음부터</button>
    <input id="seek" type="range" min="0" max="30" step="0.01" value="0">
    <span id="clock" class="meta">0.00 / 30.00 s</span>
    <button id="lang">EN</button>
  </div>
  <div class="sub" id="sub"></div>
  <div class="meta">PPEL+ · 뚜껑을 닫아라 · MnO₂/MXene/AgNW 복합 잉크 연구의 개념 연출입니다. 실제 실험 촬영물이 아닙니다.</div>
</div>
<script>
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1280, H = 720;
const TOTAL = 30;

/* ---------- palette ---------- */
const P = {
  ink:'#0d1b1f', deep:'#132525', teal:'#7fd4b0', teal2:'#2f9c7c', tealDim:'#1c5c4c',
  cream:'#f4f0d9', warm:'#f7d9a6', wall:'#8fb9b0', wall2:'#5f8d85', floor:'#efe3c8',
  coat:'#fbfbf6', card:'#b9793a', skin:'#f0c79c', hair:'#171720', red:'#e03a26', red2:'#8f1d15',
  glass:'#bfe0d8', night:'#16323a', sky:'#cfe6dd', line:'#16272c', wood:'#c08b4e', steel:'#93a7ad'
};
const LN=P.line;
function outline(w){ X.strokeStyle=LN; X.lineWidth=w||4; X.lineJoin='round'; X.stroke(); }
function fillOut(col,w){ X.fillStyle=col; X.fill(); outline(w); }
function rectOut(x,y,w,h,col,lw){ X.beginPath(); X.rect(x,y,w,h); fillOut(col,lw||4); }

/* ---------- helpers ---------- */
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
const rnd=(s)=>{s=Math.sin(s*127.1)*43758.5453;return s-Math.floor(s);};

function shake(t,amp,freq=38){ X.translate(Math.sin(t*freq)*amp, Math.cos(t*freq*1.3)*amp*0.7); }
function flash(a){ if(a<=0)return; X.fillStyle='rgba(255,255,255,'+cl(a,0,1)+')'; X.fillRect(0,0,W,H); }
function vignette(){ const g=X.createRadialGradient(W/2,H/2,H*0.52,W/2,H/2,H*0.95);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(10,25,30,0.26)'); X.fillStyle=g; X.fillRect(0,0,W,H); }
function grain(t){ X.globalAlpha=.045; for(let i=0;i<90;i++){ const s=rnd(i+Math.floor(t*24)*7);
    X.fillStyle=s>.5?'#fff':'#000'; X.fillRect(rnd(i*3.1+t)*W, rnd(i*7.7+t)*H, 2, 2);} X.globalAlpha=1; }

function speedLines(cx,cy,n,t,len,col='rgba(255,255,255,.55)'){
  X.strokeStyle=col; X.lineWidth=3;
  for(let i=0;i<n;i++){ const a=rnd(i*1.7)*Math.PI*2, r0=180+rnd(i*3.3)*260, r1=r0+len*(0.6+rnd(i*5.1));
    const w=Math.sin(t*7+i); X.globalAlpha=.35+.4*Math.abs(w);
    X.beginPath(); X.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0); X.lineTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1); X.stroke(); }
  X.globalAlpha=1;
}
function horizLines(t,dir=1,col='rgba(255,255,255,.4)'){
  X.strokeStyle=col; X.lineWidth=4;
  for(let i=0;i<18;i++){ const y=rnd(i*2.7)*H, off=((t*2400*dir)+rnd(i*9.1)*W*2)%(W*2)-W*0.5, len=120+rnd(i*4.4)*320;
    X.globalAlpha=.25+.45*rnd(i*6.2); X.beginPath(); X.moveTo(off,y); X.lineTo(off+len*dir,y); X.stroke(); }
  X.globalAlpha=1;
}

/* ---------- props ---------- */
function inkBottle(x,y,s,capOn,tilt,stain){
  X.save(); X.translate(x,y); X.rotate(tilt||0); X.scale(s,s);
  X.beginPath(); X.moveTo(-34,28); X.lineTo(-30,-22); X.quadraticCurveTo(-28,-34,-12,-38);
  X.lineTo(12,-38); X.quadraticCurveTo(28,-34,30,-22); X.lineTo(34,28);
  X.quadraticCurveTo(34,38,22,38); X.lineTo(-22,38); X.quadraticCurveTo(-34,38,-34,28);
  fillOut(P.glass,4);
  X.beginPath(); X.moveTo(-30,30); X.lineTo(-27,-4); X.lineTo(27,-4); X.lineTo(30,30);
  X.quadraticCurveTo(30,34,20,34); X.lineTo(-20,34); X.quadraticCurveTo(-30,34,-30,30);
  X.fillStyle=P.ink; X.fill();
  if(stain>0){ X.fillStyle='rgba(224,58,38,'+cl(stain,0,.92)+')';
    X.beginPath(); X.ellipse(0,-3,26*cl(stain*1.2,0,1),5.5,0,0,7); X.fill(); }
  rectOut(-24,4,48,16,P.cream,3); X.fillStyle=P.teal2; X.fillRect(-20,8,22,8);
  rectOut(-9,-52,18,16,P.glass,3);
  if(capOn) rectOut(-13,-64,26,14,P.card,3);
  X.restore();
}
function cap(x,y,s,rot){ X.save(); X.translate(x,y); X.rotate(rot); X.scale(s,s);
  rectOut(-13,-9,26,18,P.card,3.2); X.fillStyle='#e0a463'; X.fillRect(-11,-7,22,5); X.restore(); }

/* ---------- character ---------- */
/* pose: {x,y,s,rot,type:'dive'|'run'|'stand'|'slide'|'jump'|'dance'|'crouch', f:phase, flip} */
function doyun(p){
  const s=p.s||1, f=p.f||0, fl=p.flip?-1:1;
  X.save(); X.translate(p.x,p.y); X.rotate(p.rot||0); X.scale(s*fl,s);
  const seg=(x0,y0,x1,y1,x2,y2,w,col)=>{ X.lineCap='round'; X.lineJoin='round';
    X.strokeStyle=LN; X.lineWidth=w+7; X.beginPath(); X.moveTo(x0,y0); X.lineTo(x1,y1); X.lineTo(x2,y2); X.stroke();
    X.strokeStyle=col; X.lineWidth=w; X.beginPath(); X.moveTo(x0,y0); X.lineTo(x1,y1); X.lineTo(x2,y2); X.stroke(); };
  const torso=(ang)=>{ X.save(); X.rotate(ang);
    X.beginPath(); X.moveTo(-19,-62); X.lineTo(19,-62); X.quadraticCurveTo(25,-30,21,4);
    X.lineTo(-21,4); X.quadraticCurveTo(-25,-30,-19,-62); X.closePath(); fillOut(P.coat,5);
    X.beginPath(); X.moveTo(-8,-62); X.lineTo(-4,-8); X.lineTo(4,-8); X.lineTo(8,-62); X.closePath();
    X.fillStyle='#c8a06a'; X.fill(); X.strokeStyle=LN; X.lineWidth=3; X.stroke();
    X.restore(); };
  const coatTail=(ang,flap)=>{ X.save(); X.rotate(ang);
    X.beginPath(); X.moveTo(-16,-50); X.quadraticCurveTo(-34-flap*0.6,-30,-40-flap,12+flap*0.3);
    X.quadraticCurveTo(-26,4,-16,0); X.closePath(); fillOut('#e8ece6',4.2); X.restore(); };
  const head=(hx,hy,r,ang)=>{ X.save(); X.translate(hx,hy); X.rotate(ang||0);
    X.beginPath(); X.arc(0,0,r,0,7); fillOut(P.skin,4);
    X.beginPath(); X.arc(0,-r*0.34,r*0.99,Math.PI*1.06,Math.PI*1.97); X.closePath(); fillOut(P.hair,3.2);
    X.beginPath(); X.moveTo(-r*0.92,-r*0.42); X.quadraticCurveTo(-r*1.24,-r*1.18,-r*0.1,-r*1.12);
    X.quadraticCurveTo(r*0.54,-r*1.0,r*0.86,-r*0.5); X.closePath(); fillOut(P.hair,3.2);
    X.beginPath(); X.arc(r*0.36,r*0.06,r*0.32,0,7); fillOut('#f8fcfb',2.8);
    X.beginPath(); X.arc(-r*0.40,r*0.06,r*0.28,0,7); fillOut('#f8fcfb',2.8);
    X.fillStyle=LN; X.beginPath(); X.arc(r*0.38,r*0.08,r*0.13,0,7); X.fill();
    X.beginPath(); X.arc(-r*0.38,r*0.08,r*0.12,0,7); X.fill();
    X.strokeStyle=LN; X.lineWidth=2.8; X.beginPath(); X.moveTo(-r*0.12,r*0.06); X.lineTo(r*0.04,r*0.06); X.stroke();
    X.lineWidth=3.2; X.beginPath(); X.moveTo(-r*0.06,r*0.58); X.quadraticCurveTo(r*0.2,r*0.82,r*0.46,r*0.5); X.stroke();
    X.restore(); };
  const sw=Math.sin(f*2.4), sw2=Math.cos(f*2.4);

  if(p.type==='dive'){
    X.rotate(-0.06);
    coatTail(1.35,26+sw*8);
    seg(-14,-30,-46,-42+sw*6,-76,-36+sw*10,13,'#3f4a55');
    seg(-10,-22,-42,-8-sw*6,-70,2-sw*8,13,'#3f4a55');
    X.save(); X.rotate(1.5708); torso(0); X.restore();
    seg(18,-30,56,-44,96,-52,11,P.skin);
    seg(16,-16,54,-24,92,-34,11,P.skin);
    head(40,-48,15,-0.5);
  } else if(p.type==='slide'){
    X.rotate(0.10);
    coatTail(1.05,18);
    seg(-16,-16,-52,2,-88,10,13,'#3f4a55');
    seg(-12,-8,-48,16,-84,26,13,'#3f4a55');
    X.save(); X.rotate(1.15); torso(0); X.restore();
    seg(16,-40,48,-62,74,-92,11,P.skin);
    seg(14,-28,46,-34,76,-28,11,P.skin);
    head(34,-70,15,-0.25);
  } else if(p.type==='run'){
    coatTail(-0.18,20+sw*12);
    seg(-4,0,-16+sw*30,34+Math.abs(sw)*8,-6+sw*44,62-Math.abs(sw)*16,13,'#3f4a55');
    seg(4,0,16-sw*30,34+Math.abs(sw2)*8,6-sw*44,62-Math.abs(sw2)*16,13,'#3f4a55');
    torso(-0.22);
    seg(-8,-48,-34+sw*10,-30,-48+sw*22,-4,11,P.skin);
    seg(10,-48,36-sw*10,-38,52-sw*22,-52+Math.abs(sw)*10,11,P.skin);
    head(12,-78,15,-0.14);
  } else if(p.type==='jump'){
    coatTail(-0.42,34);
    seg(-6,0,-30,28,-58,40,13,'#3f4a55');
    seg(6,0,28,22,52,6,13,'#3f4a55');
    torso(-0.30);
    seg(8,-50,34,-78,44,-116,11,P.skin);
    seg(-8,-48,-34,-34,-58,-48,11,P.skin);
    head(14,-82,15,-0.2);
  } else if(p.type==='dance'){
    coatTail(-0.05+sw*0.12,16+Math.abs(sw)*14);
    seg(-5,0,-18-sw*8,32,-24-sw*14,62,13,'#3f4a55');
    seg(5,0,18+sw2*8,32,24+sw2*14,62,13,'#3f4a55');
    torso(sw*0.13);
    seg(-8,-48,-38,-72-sw2*16,-44+sw*10,-106-sw2*14,11,P.skin);
    seg(8,-48,38,-70+sw*16,44+sw2*10,-104+sw*14,11,P.skin);
    head(sw*6,-80,15,sw*0.16);
  } else {
    const c=p.type==='crouch'?22:0;
    coatTail(-0.04,12);
    seg(-5,0-c*0.2,-14,32-c*0.3,-18,62-c,13,'#3f4a55');
    seg(5,0-c*0.2,14,32-c*0.3,18,62-c,13,'#3f4a55');
    torso(-0.05);
    seg(-8,-48+c*0.3,-32,-26+c*0.3,-40,0+c*0.2,11,P.skin);
    seg(8,-48+c*0.3,32,-26+c*0.3,40,-2+c*0.2,11,P.skin);
    head(2,-78+c*0.35,15,0);
  }
  X.restore();
}
function seongman(x,y,s,f){
  X.save(); X.translate(x,y); X.scale(s,s);
  const arm=(x1,y1,x2,y2,w,col)=>{X.lineCap='round';
    X.strokeStyle=LN;X.lineWidth=w+7;X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();
    X.strokeStyle=col;X.lineWidth=w;X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();};
  arm(-10,46,-12,84,13,'#3f4a55'); arm(10,46,12,84,13,'#3f4a55');
  X.beginPath(); X.rect(-28,-18,56,66); fillOut('#9fb0b7',4.5);
  X.beginPath(); X.rect(-24,-14,48,32); fillOut('#7d8d46',4);
  arm(-24,-4,-46,12+Math.sin(f)*3,11,P.skin); arm(24,-4,46,12-Math.sin(f)*3,11,P.skin);
  X.beginPath(); X.arc(0,-38,18,0,7); fillOut(P.skin,4);
  X.beginPath(); X.ellipse(0,-50,27,9,0,0,7); fillOut('#6d7c42',3.5);
  X.beginPath(); X.rect(-17,-60,34,11); fillOut('#6d7c42',3.5);
  X.beginPath(); X.rect(-19,-26,38,9); fillOut('#f6f6ee',3);
  X.strokeStyle=LN; X.lineWidth=3;
  X.beginPath(); X.moveTo(-10,-40); X.lineTo(-3,-40); X.moveTo(4,-40); X.lineTo(11,-40); X.stroke();
  X.beginPath(); X.moveTo(-7,-30); X.quadraticCurveTo(0,-24,7,-30); X.stroke();
  X.restore();
}

/* ---------- O2 swarm ---------- */
function o2(x,y,s,t,i){
  X.save(); X.translate(x,y); X.rotate(Math.sin(t*3+i)*0.5); X.scale(s,s);
  for(const dx of [-13,13]){
    X.beginPath(); X.arc(dx,0,15,0,7); fillOut(P.red,3.4);
    X.fillStyle=P.red2; X.beginPath(); X.arc(dx,5,13,0.25,Math.PI-0.25); X.fill();
  }
  X.beginPath(); X.arc(-13,-4,6,0,7); fillOut('#fff',2.4);
  X.beginPath(); X.arc(13,-4,6,0,7); fillOut('#fff',2.4);
  X.fillStyle='#20100c'; X.beginPath(); X.arc(-12+Math.sin(t*4+i)*1.8,-4,2.8,0,7); X.fill();
  X.beginPath(); X.arc(14+Math.sin(t*4+i)*1.8,-4,2.8,0,7); X.fill();
  X.strokeStyle=LN; X.lineWidth=2.6; X.beginPath();
  X.moveTo(-20,-12); X.lineTo(-7,-7); X.moveTo(20,-12); X.lineTo(7,-7); X.stroke();
  X.restore();
}

/* ---------- environments ---------- */
function beaker(x,y,s,col){ X.save(); X.translate(x,y); X.scale(s,s);
  X.beginPath(); X.moveTo(-16,-26); X.lineTo(-13,16); X.quadraticCurveTo(-13,24,-4,24);
  X.lineTo(4,24); X.quadraticCurveTo(13,24,13,16); X.lineTo(16,-26); X.closePath(); fillOut(P.glass,3);
  X.fillStyle=col||P.teal2; X.beginPath(); X.moveTo(-13,2); X.lineTo(13,2); X.lineTo(12,16);
  X.quadraticCurveTo(12,21,4,21); X.lineTo(-4,21); X.quadraticCurveTo(-12,21,-12,16); X.closePath(); X.fill();
  X.restore(); }
function labBG(camX,camY,zoom,warm){
  X.save(); X.translate(W/2,H/2); X.scale(zoom,zoom); X.translate(-W/2-camX,-H/2-camY);
  const g=X.createLinearGradient(0,-200,0,520);
  g.addColorStop(0,warm?'#cfe6d6':'#9dc4ba'); g.addColorStop(1,warm?'#eaf4e4':'#7ba79e');
  X.fillStyle=g; X.fillRect(-400,-300,W+800,900);
  X.save(); X.translate(880,160);
  X.beginPath(); X.rect(-160,-120,320,250); fillOut(warm?'#fff3d4':'#dff0ea',6);
  X.strokeStyle=LN; X.lineWidth=6; X.beginPath();
  X.moveTo(0,-120); X.lineTo(0,130); X.moveTo(-160,5); X.lineTo(160,5); X.stroke();
  if(warm){ X.fillStyle='rgba(255,226,160,.55)'; X.beginPath();
    X.moveTo(-160,130); X.lineTo(160,130); X.lineTo(420,470); X.lineTo(-40,470); X.closePath(); X.fill(); }
  X.restore();
  X.beginPath(); X.rect(-260,150,180,120); fillOut('#cfe0d8',5);
  X.strokeStyle=LN; X.lineWidth=4; X.beginPath(); X.moveTo(-260,210); X.lineTo(-80,210); X.stroke();
  X.beginPath(); X.rect(420,120,150,110); fillOut('#e6f0ea',5);
  X.fillStyle=P.teal2; X.fillRect(436,140,118,22); X.fillStyle='#c8d8d1'; X.fillRect(436,172,90,12);
  X.beginPath(); X.rect(40,290,280,26); fillOut(P.steel,5);
  X.fillStyle=LN; X.fillRect(56,316,14,130); X.fillRect(292,316,14,130);
  for(let i=0;i<4;i++) beaker(80+i*66,272,0.8,i%2?P.teal2:P.card);
  X.beginPath(); X.rect(-400,470,W+800,H); fillOut(P.floor,0);
  X.strokeStyle=LN; X.lineWidth=6; X.beginPath(); X.moveTo(-400,470); X.lineTo(W+400,470); X.stroke();
  X.fillStyle='rgba(22,39,44,.10)';
  for(let i=0;i<7;i++) X.fillRect(-400+i*240,470,120,H);
  X.restore();
}
function benchBG(camX,camY,zoom){
  X.save(); X.translate(W/2,H/2); X.scale(zoom,zoom); X.translate(-W/2-camX,-H/2-camY);
  const g=X.createLinearGradient(0,0,0,470); g.addColorStop(0,'#8fb9b0'); g.addColorStop(1,'#bcd9d0');
  X.fillStyle=g; X.fillRect(-300,-200,W+600,700);
  X.save(); X.translate(1000,120);
  X.beginPath(); X.rect(-150,-110,300,230); fillOut('#e6f3ec',6);
  X.strokeStyle=LN; X.lineWidth=6; X.beginPath(); X.moveTo(0,-110); X.lineTo(0,120); X.stroke(); X.restore();
  beaker(210,398,1.5,P.teal2); beaker(300,404,1.1,P.card);
  X.beginPath(); X.rect(-300,430,W+600,H); fillOut(P.wood,0);
  X.strokeStyle=LN; X.lineWidth=7; X.beginPath(); X.moveTo(-300,430); X.lineTo(W+300,430); X.stroke();
  X.fillStyle='rgba(22,39,44,.12)'; X.fillRect(-300,444,W+600,10);
  X.restore();
}
function corridorBG(t,camY,zoom){
  X.save(); X.translate(W/2,H/2); X.scale(zoom,zoom); X.translate(-W/2,-H/2-camY);
  const g=X.createLinearGradient(0,0,0,H); g.addColorStop(0,'#a8cbc2'); g.addColorStop(1,'#d9e9e2');
  X.fillStyle=g; X.fillRect(0,0,W,H);
  X.fillStyle='#cfe3da'; X.beginPath(); X.moveTo(0,0); X.lineTo(W,0); X.lineTo(W,120); X.lineTo(0,150); X.closePath(); X.fill();
  for(let i=0;i<7;i++){ const x=((i*300)-(t*1300))%(W+600)-300;
    X.beginPath(); X.rect(x,150,120,300); fillOut('#7ba79e',5);
    X.fillStyle=LN; X.beginPath(); X.arc(x+104,306,7,0,7); X.fill();
    X.beginPath(); X.rect(x+150,190,60,26); fillOut('#e8f2ee',4); }
  X.beginPath(); X.rect(0,450,W,H); fillOut('#efe3c8',0);
  X.strokeStyle=LN; X.lineWidth=7; X.beginPath(); X.moveTo(0,450); X.lineTo(W,450); X.stroke();
  for(let i=0;i<12;i++){ const x=(i*200-(t*1600)%200)-200;
    X.fillStyle='rgba(22,39,44,.10)'; X.fillRect(x,470,110,8); }
  for(let i=0;i<5;i++){ const x=((i*340)-(t*900))%(W+680)-340;
    X.beginPath(); X.rect(x,40,150,22); fillOut('#fdf6dd',4); }
  X.restore();
}
function stairsBG(t,zoom,camX){
  X.save(); X.translate(W/2,H/2); X.scale(zoom,zoom); X.translate(-W/2-camX,-H/2);
  const g=X.createLinearGradient(0,-100,0,H); g.addColorStop(0,'#a3c6bd'); g.addColorStop(1,'#dcebe4');
  X.fillStyle=g; X.fillRect(-300,-200,W+600,H+400);
  X.save(); X.translate(200,90);
  X.beginPath(); X.rect(-120,-90,240,180); fillOut('#eaf6ef',6);
  X.strokeStyle=LN; X.lineWidth=5; X.beginPath(); X.moveTo(0,-90); X.lineTo(0,90); X.stroke(); X.restore();
  for(let i=0;i<11;i++){ const x=-260+i*150, y=150+i*46;
    X.beginPath(); X.rect(x,y,156,120); fillOut(i%2?'#cfe0d8':'#c2d6cd',5);
    X.beginPath(); X.rect(x,y,156,18); fillOut('#eaf3ee',4); }
  X.strokeStyle=LN; X.lineWidth=10;

let lang='ko';
function frame(t){
  t=cl(t,0,TOTAL-0.0001);
  X.setTransform(1,0,0,1,0,0);
  X.fillStyle='#000'; X.fillRect(0,0,W,H);
  for(const [a,b,fn] of CUTS){ if(t>=a&&t<b){ X.save(); fn(t); X.restore(); break; } }
  grain(t);
  const s=SUBS.find(s=>t>=s[0]&&t<s[1]);
  const el=document.getElementById('sub'); if(el) el.textContent = s? (lang==='ko'?s[2]:s[3]) : '';
  return t;
}
window.__frame = frame;

let playing=false, t0=0, base=0;
function loop(ts){ if(!playing) return;
  const t=base+(ts-t0)/1000;
  if(t>=TOTAL){ frame(TOTAL-0.001); playing=false; document.getElementById('play').textContent='재생'; return; }
  frame(t); document.getElementById('seek').value=t;
  document.getElementById('clock').textContent=t.toFixed(2)+' / 30.00 s';
  requestAnimationFrame(loop);
}
document.getElementById('play').onclick=()=>{ playing=!playing;
  document.getElementById('play').textContent=playing?'일시정지':'재생';
  if(playing){ base=parseFloat(document.getElementById('seek').value); t0=performance.now(); requestAnimationFrame(loop); } };
document.getElementById('restart').onclick=()=>{ base=0; t0=performance.now();
  document.getElementById('seek').value=0; frame(0); if(!playing){ playing=true;
  document.getElementById('play').textContent='일시정지'; requestAnimationFrame(loop);} };
document.getElementById('seek').oninput=e=>{ const t=parseFloat(e.target.value); base=t; t0=performance.now();
  frame(t); document.getElementById('clock').textContent=t.toFixed(2)+' / 30.00 s'; };
document.getElementById('lang').onclick=e=>{ lang=lang==='ko'?'en':'ko'; e.target.textContent=lang==='ko'?'EN':'KO';
