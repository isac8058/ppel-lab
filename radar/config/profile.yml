# PPEL 역량 프로필. 사전 필터와 LLM 채점 기준의 단일 소스.
# 이 파일만 고치면 크롤러와 채점기 코드를 건드리지 않아도 됨.

owner:
  name: 임수만
  affiliation: 전북대학교 유연인쇄전자전문대학원
  lab: Printed and Printable Electronics Laboratory (PPEL)
  region: 전북특별자치도

axes:
  - 전기화학센서
  - 인쇄전자
  - 에너지하베스팅
  - 소재·계산
  - 표준화
  - 사업화

capabilities: |
  인쇄·유연전자 공정(스크린, 그라비아, 잉크젯, DLP), MXene 및 2D 소재,
  전기화학 바이오센서와 SPCE 기반 진단, 마찰전기 및 압전 나노발전기,
  슈퍼커패시터와 에너지 저장소자, 멤리스터와 뉴로모픽 소자,
  DLP 마이크로니들 플랫폼, DFT 기반 계산 재료과학과 COMSOL 멀티스케일 해석,
  IEC TC119 인쇄전자 국제표준화 국내위원 활동, 특허 17건.

# 1차 필터. 제목 또는 본문에 아래 중 하나라도 걸리면 LLM 채점 대상.
# LLM 호출 비용을 줄이기 위한 관문이며 느슨하게 잡음.
