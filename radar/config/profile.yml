# 제목에 걸리면 즉시 제외. 명백히 무관한 분야만 넣을 것.
exclude_keywords:
  - 테스트 입니다
  - (TEST)
  - 원자력안전
  - 산림
  - 어업
  - 축산 방역
  - 교통사고

# 마감일 없는 공고의 기본 유효기간(일). 상세에서 못 뽑았을 때만 사용.
fallback_window_days: 30

# 교내 접수 마감 역산에 쓰는 영업일 수.
internal_lead_business_days: 5
